server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: si la ruta no matchea un archivo real, cae a index.html.
    # Hoy la app no usa client-side routing, pero deja el terreno listo.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite ya vienen con hash en el nombre, se pueden cachear fuerte.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
